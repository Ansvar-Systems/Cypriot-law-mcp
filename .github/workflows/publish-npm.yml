# Conforms to MCP Infrastructure & Deployment Standard §5.1.
# Triggered on push to main when source / data / package.json change.
# Idempotent: skips if version already on npm. Uses Trusted Publishing (OIDC).

name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version already published
        id: check
        run: |
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} already on npm — skipping"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.already_published == 'false'
        run: npm ci

      - name: Lint and test
        if: steps.check.outputs.already_published == 'false'
        run: |
          npm run lint
          npm test
          npm run test:contract

      - name: Build
        if: steps.check.outputs.already_published == 'false'
        run: npm run build

      - name: Build database
        if: steps.check.outputs.already_published == 'false'
        run: npm run build:db

      - name: Publish
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --access public --provenance
